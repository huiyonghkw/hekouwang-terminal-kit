<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:46px;}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:30px 26px;display:flex;flex-direction:column;box-shadow:0 10px 26px rgba(60,45,30,.06);}
  .num{font-family:var(--mono);font-size:15px;color:var(--clay);font-weight:500;letter-spacing:.1em;}
  .st-t{font-family:var(--cn);font-weight:700;font-size:25px;margin-top:14px;line-height:1.25;}
  .st-d{font-family:var(--cn);font-size:16px;color:var(--t2);margin-top:12px;line-height:1.55;flex:1;}
  .badge{margin-top:20px;font-family:var(--cn);font-size:14px;font-weight:500;
    color:var(--clay);background:var(--clay-bg);border-radius:999px;padding:7px 14px;align-self:flex-start;}
</style></head>
<body>
  <div class="eyebrow">How it works · 总览</div>
  <h1>四步，<span class="hl">从安装到进阶</span></h1>
  <div class="sub">照着走就行：真正要动手的只有第一步，复制粘贴一次。</div>
  <div class="grid">
    <div class="step"><div class="num">第 1 步</div><div class="st-t">一条命令<br>装齐</div>
      <div class="st-d">复制一句命令粘进终端，回车等它跑完。</div><div class="badge">✅ 复制粘贴一次</div></div>
    <div class="step"><div class="num">第 2 步</div><div class="st-t">颜值<br>自动搞定</div>
      <div class="st-d">主题 / 配色 / 字体脚本已写好，看一眼就懂。</div><div class="badge">⚙️ 脚本自动</div></div>
    <div class="step"><div class="num">第 3 步</div><div class="st-t">学会用<br>命令行神器</div>
      <div class="st-d">6 个工具一句话会用，平时敲命令直接上。</div><div class="badge">📖 看一眼会用</div></div>
    <div class="step"><div class="num">第 4 步</div><div class="st-t">进阶<br>玩法</div>
      <div class="st-d">Dynamic Profile、热键窗口，想折腾再看。</div><div class="badge">🚀 可选</div></div>
  </div>
  <div class="grow"></div>
  <div class="foot">
    <div class="handle">不懂命令行也行 —— 只需会「复制 → 粘贴 → 回车」</div>
    <div style="text-align:right"><div class="brand">会勇禾口王的AI笔记</div><div class="handle">@huiyonghkw</div></div>
  </div>
</body></html>
